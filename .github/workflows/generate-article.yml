name: Generate article (auto-publish + safety net)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Sujet libre (optionnel)."
        required: false
        type: string
      category:
        description: "Catégorie si topic renseigné"
        required: false
        default: 'epargne'
        type: choice
        options: [epargne, banques, assurances, credit, investissement]
      no_auto_publish:
        description: "Forcer une PR de revue même si le critic approuve"
        required: false
        default: false
        type: boolean
  schedule:
    # Lundi, mercredi, vendredi à 08:00 UTC (09:00 Casablanca hiver).
        - cron: '0 8 * * *'

concurrency:
  group: generate-article
  cancel-in-progress: false

jobs:
  generate:
    name: Generate + auto-publish or PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate + review
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ inputs.no_auto_publish }}" = "true" ]; then
            FLAGS="--no-auto-publish"
          fi
          if [ -n "${{ inputs.topic }}" ]; then
            node scripts/generate-article.mjs \
              --topic="${{ inputs.topic }}" \
              --category="${{ inputs.category }}" \
              $FLAGS
          else
            node scripts/generate-article.mjs $FLAGS
          fi

      - name: Astro check (block on invalid schema)
        run: npm run check

      - name: Astro build (block on rendering error)
        run: npm run build

      # --- BRANCH A : auto-publish -------------------------------------------
      - name: Commit + push to main (auto-publish)
        if: steps.gen.outputs.verdict == 'auto_publish' && steps.gen.outputs.draft == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "epargner-maroc-bot"
          git config user.email "bot@epargnermaroc.ma"
          git add "${{ steps.gen.outputs.path }}" content-ideas.json
          git commit -m "content(auto): ${{ steps.gen.outputs.title }}

          score: ${{ steps.gen.outputs.score }}
          verdict: ${{ steps.gen.outputs.verdict }}
          slug: ${{ steps.gen.outputs.slug }}

          [ai-generated] Cet article a été rédigé par IA puis relu automatiquement.
          Utiliser \`npm run unpublish -- --slug=${{ steps.gen.outputs.slug }}\` pour révoquer."
          git push origin HEAD:main

      # --- BRANCH B : needs review -------------------------------------------
      - name: Open PR (needs review)
        if: steps.gen.outputs.verdict == 'needs_review'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "content(draft): ${{ steps.gen.outputs.title }}"
          branch: "ai-draft/${{ steps.gen.outputs.slug }}"
          delete-branch: true
          title: "🔍 AI draft à revoir — ${{ steps.gen.outputs.title }}"
          labels: |
            ai-draft
            needs-review
          body: |
            🤖 Draft d'article — **revue humaine requise** (le critic a signalé des risques).

            - **Slug** : `${{ steps.gen.outputs.slug }}`
            - **Fichier** : `${{ steps.gen.outputs.path }}`
            - **Score critic** : `${{ steps.gen.outputs.score }} / 100` (seuil auto-publish : 75)
            - **Verdict** : `${{ steps.gen.outputs.verdict }}`

            Voir le champ `aiReview.notes` du frontmatter pour la liste des
            blockers/softs remontés par le critic. Corriger, basculer
            `draft: false` puis merger pour publier.
